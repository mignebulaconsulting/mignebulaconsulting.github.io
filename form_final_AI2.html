<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Readiness Assessment | Nebula Consulting</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --nebula-blue: #313A4C; --nebula-pop: #BAD532; --nebula-deep: #0D5C22;
    --nebula-forest: #3B824B; --nebula-sage: #6FA578; --nebula-mint: #B2D4B8;
    --nebula-mist: #F2F6E6; --nebula-silver: #E5E5E5; --nebula-slate: #707070;
    --white: #FFFFFF; --font: 'Open Sans', sans-serif; --radius: 16px;
  }
  #nebula-quiz-container { color: var(--nebula-blue); font-family: var(--font); max-width: 800px; margin: 0 auto; padding: 24px; }
  .intro { text-align: center; }
  .intro-tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--nebula-blue); background: var(--nebula-pop); padding: 6px 18px; border-radius: 100px; margin-bottom: 28px; }
  .intro h1 { font-size: clamp(34px, 5.5vw, 58px); font-weight: 800; line-height: 1.08; margin-bottom: 20px; }
  .intro h1 span { color: var(--nebula-forest); }
  .intro p { font-size: 16px; color: var(--nebula-slate); line-height: 1.7; max-width: 520px; margin: 0 auto 36px; }
  .pillars-row, .tier-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
  .pillar-chip, .tier-chip { display: flex; align-items: center; gap: 8px; background: var(--white); border: 1.5px solid var(--nebula-mint); padding: 8px 18px; border-radius: 100px; font-size: 12px; font-weight: 600; }
  .tier-chip { border-color: var(--nebula-silver); border-radius: 8px; color: var(--nebula-slate); font-size: 11px; padding: 7px 14px; }
  .chip-dot { width: 8px; height: 8px; border-radius: 50%; }
  .tier-num { width: 18px; height: 18px; border-radius: 50%; background: var(--nebula-blue); color: white; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  .btn-start, .btn-submit { display: inline-flex; align-items: center; gap: 10px; background: var(--nebula-blue); color: white; font-weight: 700; padding: 16px 40px; border-radius: 100px; border: none; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 24px rgba(0,0,0,0.15); }
  .progress-wrap { margin-bottom: 40px; }
  .progress-track { height: 4px; background: var(--nebula-silver); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--nebula-forest), var(--nebula-pop)); transition: width 0.5s ease; }
  .question-card, .email-card { background: var(--white); border: 1.5px solid var(--nebula-silver); border-left: 4px solid var(--nebula-pop); border-radius: var(--radius); padding: 40px; margin-bottom: 20px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); }
  .q-text { font-size: 21px; font-weight: 700; margin-bottom: 28px; }
  .option { display: flex; align-items: flex-start; gap: 14px; background: var(--white); border: 1.5px solid var(--nebula-silver); border-radius: 12px; padding: 16px 18px; cursor: pointer; transition: 0.18s; text-align: left; width: 100%; margin-bottom: 10px; }
  .option:hover, .option.selected { border-color: var(--nebula-forest); background: var(--nebula-mist); }
  .option-indicator { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--nebula-silver); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .option.selected .option-indicator { background: var(--nebula-forest); border-color: var(--nebula-forest); }
  .email-input { width: 100%; padding: 16px; border-radius: 12px; border: 1.5px solid var(--nebula-silver); font-size: 16px; margin-bottom: 12px; outline: none; }
  
  /* Restored original results design */
  .results { opacity: 0; transition: all 0.45s ease; }
  .results.visible { opacity: 1; }
  .result-hero { background: var(--nebula-blue); border-radius: var(--radius); padding: 52px 40px; text-align: center; color: white; margin-bottom: 16px; position: relative; overflow: hidden; }
  .result-tier-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--nebula-pop); letter-spacing: 0.2em; margin-bottom: 10px; }
  .result-tier-name { font-size: clamp(38px, 6vw, 58px); font-weight: 800; margin-bottom: 4px; }
  .result-divider { width: 48px; height: 3px; background: var(--nebula-pop); margin: 16px auto 20px; }
  .result-subtitle { font-size: 15px; color: var(--nebula-mint); line-height: 1.7; max-width: 500px; margin: 0 auto 28px; }
  .result-score-chip { display: inline-flex; align-items: center; background: rgba(255,255,255,0.08); padding: 10px 24px; border-radius: 100px; font-weight: 700; color: white; gap: 10px; }
  .score-star { color: var(--nebula-pop); }

  .tier-legend { background: var(--white); border: 1.5px solid var(--nebula-silver); border-radius: var(--radius); padding: 24px 28px; margin-bottom: 16px; }
  .section-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--nebula-slate); margin-bottom: 16px; letter-spacing: 0.16em; }
  .tier-legend-items { display: flex; gap: 8px; flex-wrap: wrap; }
  .tier-legend-item { flex: 1; background: var(--nebula-mist); border: 1.5px solid var(--nebula-mint); padding: 12px; border-radius: 10px; text-align: center; min-width: 110px; }
  .tier-legend-item.active { background: var(--nebula-blue); border-color: var(--nebula-blue); color: white; }
  .tier-legend-num { font-size: 10px; font-weight: 800; margin-bottom: 4px; color: var(--nebula-sage); }
  .tier-legend-item.active .tier-legend-num { color: var(--nebula-pop); }

  .breakdown-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .pillar-card { background: var(--white); border: 1.5px solid var(--nebula-silver); border-radius: var(--radius); padding: 24px; border-top: 4px solid var(--nebula-mint); }
  .pillar-card-name { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--nebula-slate); margin-bottom: 10px; }
  .pillar-card-score { font-size: 34px; font-weight: 800; color: var(--nebula-blue); margin-bottom: 12px; line-height: 1; }
  .pillar-card-score span { font-size: 15px; font-weight: 400; color: var(--nebula-slate); }
  .pillar-track { height: 5px; background: var(--nebula-silver); border-radius: 10px; overflow: hidden; }
  .pillar-fill { height: 100%; border-radius: 10px; transition: width 1s ease 0.4s; }

  .recs-card { background: var(--white); border: 1.5px solid var(--nebula-silver); border-left: 4px solid var(--nebula-pop); border-radius: var(--radius); padding: 32px 36px; margin-bottom: 16px; }
  .rec-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .rec-list li { display: flex; gap: 14px; font-size: 14px; line-height: 1.65; }
  .rec-num { min-width: 24px; height: 24px; background: var(--nebula-blue); color: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

    <div id="intro" class="intro">

      <button type="button" class="btn-start" onclick="startQuiz()">Begin Assessment</button>

    <div id="quiz" class="hidden">

      <div id="question-card" class="question-card">
        <div id="q-pillar" style="font-size:10px; font-weight:800; text-transform:uppercase; margin-bottom:10px;"></div>

        <div id="options-list" class="options"></div>

      <div style="text-align:right">

      <input type="hidden" name="AI_Q7_Employee_Sentiment" id="hid_q7">
      <input type="hidden" name="AI_Q8_Technology_Piloting" id="hid_q8">
      <input type="hidden" name="AI_Q9_Output_Trust" id="hid_q9">
      <input type="hidden" name="AI_Data_Technology" id="hid_score_data">
      <input type="hidden" name="AI_Strategy_Governance" id="hid_score_strat">
      <input type="hidden" name="AI_People_Adoption" id="hid_score_people">
      <input type="hidden" name="AI_Overall_Score" id="hid_score_total">
      <input type="hidden" name="AI_Level" id="hid_tier_name">

      <button type="submit" class="btn-submit">Submit & View Results</button>
    </div>

    <div id="results" class="results hidden"></div>
  </form>
</div>
