<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Readiness Test | Nebula Consulting</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --nebula-blue: #313A4C;
    --nebula-pop: #BAD532;
    --nebula-forest: #3B824B;
    --white: #FFFFFF;
    --nebula-silver: #E5E5E5;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { background: #EFEFED; color: var(--nebula-blue); font-family: var(--font); line-height: 1.5; }
  .site-header { background: var(--nebula-blue); height: 64px; display: flex; align-items: center; padding: 0 40px; border-bottom: 3px solid var(--nebula-pop); color: white; font-weight: bold; }
  .container { max-width: 500px; margin: 50px auto; padding: 0 20px; }
  .card { background: var(--white); border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-left: 5px solid var(--nebula-pop); }
  .hidden { display: none; }
  h1 { font-size: 24px; margin-bottom: 10px; }
  .option { border: 2px solid var(--nebula-silver); border-radius: 10px; padding: 15px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; text-align: left; }
  .option:hover { border-color: var(--nebula-pop); }
  .option.selected { border-color: var(--nebula-forest); background: #F2F6E6; font-weight: bold; }
  .email-input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid var(--nebula-silver); margin: 20px 0; font-size: 16px; outline: none; }
  .btn { background: var(--nebula-blue); color: white; padding: 15px; border-radius: 50px; border: none; width: 100%; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .success-check { font-size: 48px; color: var(--nebula-forest); margin-bottom: 10px; text-align: center; }
</style>
</head>
<body>

<header class="site-header">NEBULA CONSULTING</header>

<div class="container">
  <form  id="MCYVEOTINIDRCTHJJ4JWWGYJUFVU" data-uma-forms="true" onsubmit="return false;">
    
    <div id="step-1" class="card">
      <h1>AI Readiness</h1>
      <p>How is your data organized?</p>
      <div class="option" onclick="selectScore(1, 'Exploring', this)">Silos & Spreadsheets</div>
      <div class="option" onclick="selectScore(2, 'Gliding', this)">Centralized but messy</div>
      <div class="option" onclick="selectScore(3, 'Propelling', this)">Clean & Organized</div>
      <div class="option" onclick="selectScore(4, 'Soaring', this)">Fully Governed</div>
      
      <input type="hidden" id="ai_score_val" name="ai_score">
      <input type="hidden" id="ai_level_val" name="ai_level">
      
      <button type="button" id="next-btn" class="btn" style="margin-top:20px" disabled onclick="showStep(2)">Next Step</button>
    </div>

    <div id="step-2" class="card hidden">
      <h1>Final Step</h1>
      <p>Enter your email to see your results.</p>
      <input type="email" id="email-field" name="email" class="email-input" placeholder="email@company.com" required>
      <button type="button" class="btn" onclick="processResults()">Show My Results</button>
    </div>

    <div id="step-success" class="card hidden" style="text-align: center;">
      <div class="success-check">✓</div>
      <h1 style="color: var(--nebula-forest)">Assessment Complete</h1>
      <p id="result-display" style="font-weight: bold; margin: 15px 0; font-size: 18px;"></p>
      <p>Thank you for testing the readiness form.</p>
      <button type="button" class="btn" style="margin-top: 20px;" onclick="window.location.reload()">Restart</button>
    </div>

  </form>
  </div>
<script async src="https://nebula.my.site.com/lp/assets/scripts/external-form-handler-host.min.js" onload="SFDCFormHandler.init('https://nebula.my.site.com/lp')"></script>
<script>
  function selectScore(score, level, el) {
    // Store values in hidden inputs
    document.getElementById('ai_score_val').value = score;
    document.getElementById('ai_level_val').value = level;
    
    // UI selection logic
    document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
    el.classList.add('selected');
    
    // Enable "Next" button
    document.getElementById('next-btn').disabled = false;
  }

  function showStep(stepNum) {
    document.getElementById('step-1').classList.add('hidden');
    document.getElementById('step-2').classList.remove('hidden');
  }

  function processResults() {
    const email = document.getElementById('email-field').value;
    const score = document.getElementById('ai_score_val').value;
    const level = document.getElementById('ai_level_val').value;
    
    if (!email || !email.includes('@')) {
      alert("Please enter a valid email address.");
      return;
    }

    // Display the specific AI Level and Score
    document.getElementById('result-display').innerText = `AI Level: ${level} (Score: ${score})`;
    
    // Switch to success card
    document.getElementById('step-2').classList.add('hidden');
    document.getElementById('step-success').classList.remove('hidden');
  }
</script>

</body>
</html>
