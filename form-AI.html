<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Readiness Test | Nebula Consulting</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --nebula-blue: #313A4C;
    --nebula-pop: #BAD532;
    --nebula-forest: #3B824B;
    --white: #FFFFFF;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { background: #EFEFED; color: var(--nebula-blue); font-family: var(--font); line-height: 1.5; }
  .site-header { background: var(--nebula-blue); height: 64px; display: flex; align-items: center; padding: 0 40px; border-bottom: 3px solid var(--nebula-pop); color: white; font-weight: bold; }
  .container { max-width: 500px; margin: 50px auto; padding: 0 20px; }
  .card { background: var(--white); border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-left: 5px solid var(--nebula-pop); }
  .hidden { display: none; }
  h1 { font-size: 24px; margin-bottom: 10px; }
  .option { border: 2px solid #E5E5E5; border-radius: 10px; padding: 15px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
  .option:hover { border-color: var(--nebula-pop); }
  .option.selected { border-color: var(--nebula-forest); background: #F2F6E6; font-weight: bold; }
  .email-input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #E5E5E5; margin: 20px 0; font-size: 16px; }
  .btn { background: var(--nebula-blue); color: white; padding: 15px; border-radius: 50px; border: none; width: 100%; font-weight: bold; cursor: pointer; }
  .btn:disabled { background: #ccc; }
  .success-check { font-size: 48px; color: var(--nebula-forest); margin-bottom: 10px; }
</style>
</head>
<body>

<header class="site-header">NEBULA CONSULTING</header>

<div class="container">
  <form  id="MCYVEOTINIDRCTHJJ4JWWGYJUFVU" data-uma-forms="true">
    
    <div id="step-1" class="card">
      <h1>AI Readiness</h1>
      <p>How is your data organized?</p>
      <div class="option" onclick="selectScore(1, 'Exploring', this)">Silos & Spreadsheets</div>
      <div class="option" onclick="selectScore(2, 'Gliding', this)">Centralized but messy</div>
      <div class="option" onclick="selectScore(3, 'Propelling', this)">Clean & Organized</div>
      <div class="option" onclick="selectScore(4, 'Soaring', this)">Fully Governed</div>
      
      <input type="hidden" name="ai_score" id="ai_score_input">
      <input type="hidden" name="ai_level" id="ai_level_input">

      <button type="button" id="next-btn" class="btn" style="margin-top:20px" disabled onclick="showEmailStep()">Next Step</button>
    </div>

    <div id="step-2" class="card hidden">
      <h1>Final Step</h1>
      <p>Enter your email to sync results.</p>
      <input type="email" name="email" id="email-field" class="email-input" placeholder="email@company.com" required>
      <button type="submit" class="btn">Submit to Marketing Cloud</button>
    </div>
  </form>

  <div id="step-success" class="card hidden" style="text-align: center;">
    <div class="success-check">✓</div>
    <h1 style="color: var(--nebula-forest)">Submission Successful</h1>
    <p id="result-display" style="font-weight: bold; margin-bottom: 10px;"></p>
    <p>Your data has been sent to your Unified Customer Profile.</p>
    <button class="btn" style="margin-top: 20px;" onclick="window.location.reload()">Test Another Email</button>
  </div>
</div>


<script async src="https://nebula.my.site.com/lp/assets/scripts/external-form-handler-host.min.js" onload="SFDCFormHandler.init('https://nebula.my.site.com/lp')"></script>
 
<script>
  // Modified to handle both score and level label
  function selectScore(score, level, el) {
    document.getElementById('ai_score_input').value = score;
    document.getElementById('ai_level_input').value = level;
    document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('next-btn').disabled = false;
  }

  function showEmailStep() {
    document.getElementById('step-1').classList.add('hidden');
    document.getElementById('step-2').classList.remove('hidden');
  }

  // Handle display logic upon submission
  const form = document.getElementById('MC2H62NAMVRJGXPGNSH2XONEHNTA');
  form.onsubmit = function() {
    const finalScore = document.getElementById('ai_score_input').value;
    const finalLevel = document.getElementById('ai_level_input').value;

    // Short timeout to allow the SFDC script to capture data before hiding form
    setTimeout(() => {
      document.getElementById('result-display').innerText = `Your AI Level: ${finalLevel} (Score: ${finalScore})`;
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-success').classList.remove('hidden');
    }, 500);
  };
</script>

</body>
</html>
