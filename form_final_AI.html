<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Readiness Assessment | Nebula Consulting</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --nebula-blue: #313A4C;
    --nebula-pop: #BAD532;
    --nebula-forest: #3B824B;
    --nebula-mint: #B2D4B8;
    --nebula-mist: #F2F6E6;
    --nebula-silver: #E5E5E5;
    --nebula-slate: #707070;
    --white: #FFFFFF;
    --font: 'Open Sans', Helvetica, Arial, sans-serif;
    --radius: 16px;
  }
  #nebula-quiz-container { color: var(--nebula-blue); font-family: var(--font); max-width: 800px; margin: 0 auto; padding: 24px; }
  .intro { text-align: center; }
  .intro-tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--nebula-blue); background: var(--nebula-pop); padding: 6px 18px; border-radius: 100px; margin-bottom: 28px; }
  .intro h1 { font-size: clamp(34px, 5.5vw, 58px); font-weight: 800; line-height: 1.08; color: var(--nebula-blue); margin-bottom: 20px; }
  .intro h1 span { color: var(--nebula-forest); }
  .intro p { font-size: 16px; color: var(--nebula-slate); line-height: 1.7; max-width: 520px; margin: 0 auto 36px; }
  .pillars-row, .tier-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
  .pillar-chip, .tier-chip { display: flex; align-items: center; gap: 8px; background: var(--white); border: 1.5px solid var(--nebula-mint); padding: 8px 18px; border-radius: 100px; font-size: 12px; font-weight: 600; color: var(--nebula-blue); }
  .tier-chip { border-color: var(--nebula-silver); border-radius: 8px; color: var(--nebula-slate); font-size: 11px; padding: 7px 14px; }
  .chip-dot { width: 8px; height: 8px; border-radius: 50%; }
  .tier-num { width: 18px; height: 18px; border-radius: 50%; background: var(--nebula-blue); color: white; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  .btn-start { display: inline-flex; align-items: center; gap: 10px; background: var(--nebula-blue); color: var(--white); font-weight: 700; font-size: 14px; padding: 16px 40px; border-radius: 100px; border: none; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 24px rgba(49,58,76,0.25); }
  .btn-start:hover { transform: translateY(-2px); background: #3C4456; }
  .progress-wrap { margin-bottom: 40px; }
  .progress-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .progress-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--nebula-slate); }
  .progress-track { height: 4px; background: var(--nebula-silver); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--nebula-forest), var(--nebula-pop)); transition: width 0.5s ease; }
  .question-card, .email-card { background: var(--white); border: 1.5px solid var(--nebula-silver); border-left: 4px solid var(--nebula-pop); border-radius: var(--radius); padding: 40px; margin-bottom: 20px; box-shadow: 0 2px 16px rgba(49,58,76,0.07); }
  .q-pillar { font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
  .q-text { font-size: clamp(17px, 2.5vw, 21px); font-weight: 700; color: var(--nebula-blue); margin-bottom: 28px; }
  .email-input { width: 100%; padding: 16px; border-radius: 12px; border: 1.5px solid var(--nebula-silver); font-size: 16px; margin-bottom: 12px; outline: none; }
  .option { display: flex; align-items: flex-start; gap: 14px; background: var(--white); border: 1.5px solid var(--nebula-silver); border-radius: 12px; padding: 16px 18px; cursor: pointer; transition: 0.18s; text-align: left; width: 100%; margin-bottom: 10px; }
  .option:hover, .option.selected { border-color: var(--nebula-forest); background: var(--nebula-mist); }
  .option-indicator { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--nebula-silver); flex-shrink: 0; }
  .option.selected .option-indicator { background: var(--nebula-forest); border-color: var(--nebula-forest); }
  .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .btn-nav { font-weight: 700; font-size: 13px; padding: 13px 28px; border-radius: 100px; border: none; cursor: pointer; }
  .btn-back { background: transparent; color: var(--nebula-slate); border: 1.5px solid var(--nebula-silver); }
  .btn-next { background: var(--nebula-blue); color: white; }
  .btn-next:disabled { opacity: 0.3; }
  .results { opacity: 0; transition: 0.45s ease; }
  .results.visible { opacity: 1; }
  .result-hero { background: var(--nebula-blue); border-radius: var(--radius); padding: 52px 40px; text-align: center; color: white; margin-bottom: 16px; }
  .breakdown-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .pillar-card { background: var(--white); border: 1.5px solid var(--nebula-silver); border-radius: var(--radius); padding: 24px; border-top: 4px solid var(--nebula-mint); }
  .recs-card { background: var(--white); border: 1.5px solid var(--nebula-silver); border-left: 4px solid var(--nebula-pop); padding: 32px; border-radius: var(--radius); margin-bottom: 16px; }
  .rec-list { list-style: none; padding: 0; }
  .rec-list li { display: flex; gap: 14px; margin-bottom: 12px; font-size: 14px; }
  .rec-num { min-width: 24px; height: 24px; background: var(--nebula-blue); color: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="nebula-quiz-container">
  <form id="MC32QKQP6N55BIRPJ5OBMZ4JHTYM" data-uma-forms="true" onsubmit="event.preventDefault();">

    <div id="intro" class="intro">
      <div class="intro-tag">Assessment Tool</div>
      <h1>Are you ready<br>for <span>Agentforce?</span></h1>
      <p>Answer 9 questions to get an honest picture of your organisation's AI readiness — across data, strategy, and your people.</p>
      <div class="pillars-row">
        <div class="pillar-chip"><div class="chip-dot" style="background:#3B824B"></div> Data & Tech</div>
        <div class="pillar-chip"><div class="chip-dot" style="background:#313A4C"></div> Strategy & Gov</div>
        <div class="pillar-chip"><div class="chip-dot" style="background:#BAD532"></div> People & Adoption</div>
      </div>
      <button type="button" class="btn-start" onclick="startQuiz()">Begin Assessment</button>
    </div>

    <div id="quiz" class="hidden">
      <div class="progress-wrap">
        <div class="progress-meta"><span class="progress-label">Progress</span><span id="progress-count">1 / 9</span></div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div>
      </div>
      <div id="question-card" class="question-card">
        <div id="q-pillar" class="q-pillar"></div>
        <div id="q-text" class="q-text"></div>
        <div id="options-list" class="options"></div>
      </div>
      <div class="nav-buttons">
        <button type="button" id="btn-back" class="btn-nav btn-back" onclick="goBack()">← Back</button>
        <button type="button" id="btn-next" class="btn-nav btn-next" onclick="goNext()" disabled>Next →</button>
      </div>
    </div>

    <div id="email-step" class="email-card hidden">
      <div class="q-pillar" style="color: var(--nebula-blue)">Final Step</div>
      <div class="q-text">Where should we send your results?</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px;">
        <input type="text" id="first-name" name="FirstName" class="email-input" placeholder="First Name" required>
        <input type="text" id="last-name" name="LastName" class="email-input" placeholder="Last Name" required>
      </div>
      <input type="text" id="company" name="Company" class="email-input" placeholder="Company Name" required>
      <input type="email" id="user-email" name="Email" class="email-input" placeholder="email@company.com" required>

      <input type="hidden" name="AI_Q1_Data_State" id="hid_q1">
      <input type="hidden" name="AI_Q2_Information_Access" id="hid_q2">
      <input type="hidden" name="AI_Q3_System_Integration" id="hid_q3">
      <input type="hidden" name="AI_Q4_Priority_Origin" id="hid_q4">
      <input type="hidden" name="AI_Q5_Governance_Process" id="hid_q5">
      <input type="hidden" name="AI_Q6_Data_Compliance" id="hid_q6">
      <input type="hidden" name="AI_Q7_Employee_Sentiment" id="hid_q7">
      <input type="hidden" name="AI_Q8_Technology_Piloting" id="hid_q8">
      <input type="hidden" name="AI_Q9_Output_Trust" id="hid_q9">
      <input type="hidden" name="AI_Data_Technology" id="hid_score_data">
      <input type="hidden" name="AI_Strategy_Governance" id="hid_score_strat">
      <input type="hidden" name="AI_People_Adoption" id="hid_score_people">
      <input type="hidden" name="AI_Overall_Score" id="hid_score_total">
      <input type="hidden" name="AI_Level" id="hid_tier_name">

      <button type="button" class="btn-start" onclick="handleEmailSubmit()">Get My Results</button>
    </div>

    <div id="results" class="results hidden"></div>
  </form>
</div>

<script>
const QUESTIONS = [
  { pillar: "Data & Technology", pillarColor: "#3B824B", pillarKey: "data", text: "How is your data organized?", options: [{ label: "Spreadsheets & Silos", score: 1 }, { label: "Centralized but messy", score: 2 }, { label: "Mostly clean", score: 3 }, { label: "Fully governed", score: 4 }] },
  { pillar: "Data & Technology", pillarColor: "#3B824B", pillarKey: "data", text: "How do teams find info?", options: [{ label: "Manual search", score: 1 }, { label: "Usually find it", score: 2 }, { label: "Dashboards", score: 3 }, { label: "Surfaced in context", score: 4 }] },
  { pillar: "Data & Technology", pillarColor: "#3B824B", pillarKey: "data", text: "Connectivity level?", options: [{ label: "Largely separate", score: 1 }, { label: "Some integration", score: 2 }, { label: "Integrated mostly", score: 3 }, { label: "Fully automated", score: 4 }] },
  { pillar: "Strategy & Governance", pillarColor: "#313A4C", pillarKey: "strategy", text: "AI Priority Origin?", options: [{ label: "Competitor pressure", score: 1 }, { label: "Genuine interest", score: 2 }, { label: "Roadmap exists", score: 3 }, { label: "KPI driven", score: 4 }] },
  { pillar: "Strategy & Governance", pillarColor: "#313A4C", pillarKey: "strategy", text: "Governance process?", options: [{ label: "No oversight", score: 1 }, { label: "Informal review", score: 2 }, { label: "Defined criteria", score: 3 }, { label: "Sign-off required", score: 4 }] },
  { pillar: "Strategy & Governance", pillarColor: "#313A4C", pillarKey: "strategy", text: "Compliance handling?", options: [{ label: "Not mapped", score: 1 }, { label: "Broadly compliant", score: 2 }, { label: "Clear policies", score: 3 }, { label: "Fully embedded", score: 4 }] },
  { pillar: "People & Adoption", pillarColor: "#BAD532", pillarKey: "people", text: "Workforce sentiment?", options: [{ label: "Anxious", score: 1 }, { label: "Mixed", score: 2 }, { label: "Positive", score: 3 }, { label: "Genuinely excited", score: 4 }] },
  { pillar: "People & Adoption", pillarColor: "#BAD532", pillarKey: "people", text: "Pilot history?", options: [{ label: "Often fade", score: 1 }, { label: "Difficult to scale", score: 2 }, { label: "Lessons learned", score: 3 }, { label: "Repeatable model", score: 4 }] },
  { pillar: "People & Adoption", pillarColor: "#BAD532", pillarKey: "people", text: "Trust in AI output?", options: [{ label: "Skeptical", score: 1 }, { label: "Varies", score: 2 }, { label: "Strong start", score: 3 }, { label: "High confidence", score: 4 }] }
];

const TIERS = [
  { min: 9, max: 14, num: 1, name: "Exploring", color: "#A63D2F", recs: ["Identify data gaps.", "Build trust."] },
  { min: 15, max: 20, num: 2, name: "Gliding", color: "#C8890A", recs: ["Prioritize quality.", "Scoped pilot."] },
  { min: 21, max: 27, num: 3, name: "Propelling", color: "#3B824B", recs: ["Scale pilots.", "Ethics focus."] },
  { min: 28, max: 33, num: 4, name: "Cruising", color: "#0D5C22", recs: ["Cross-functional workflows.", "Audit systems."] },
  { min: 34, max: 36, num: 5, name: "Soaring", color: "#313A4C", recs: ["Advanced agents.", "Package maturity."] }
];

let currentQ = 0; let answers = {};

function startQuiz() { document.getElementById('intro').classList.add('hidden'); document.getElementById('quiz').classList.remove('hidden'); renderQuestion(); }

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const card = document.getElementById('question-card'); card.classList.remove('visible');
  setTimeout(() => {
    document.getElementById('q-pillar').textContent = q.pillar; document.getElementById('q-pillar').style.color = q.pillarColor;
    document.getElementById('q-text').textContent = q.text;
    const list = document.getElementById('options-list'); list.innerHTML = '';
    q.options.forEach((opt, i) => {
      const div = document.createElement('div'); div.className = 'option' + (answers[currentQ] === i ? ' selected' : '');
      div.onclick = () => selectOption(i);
      div.innerHTML = `<div class="option-indicator"></div><div class="option-label">${opt.label}</div>`;
      list.appendChild(div);
    });
    document.getElementById('progress-count').textContent = `${currentQ+1} / 9`;
    document.getElementById('progress-fill').style.width = ((currentQ / 9) * 100) + '%';
    document.getElementById('btn-back').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
    document.getElementById('btn-next').disabled = answers[currentQ] === undefined;
    card.classList.add('visible');
  }, 160);
}

function selectOption(i) { answers[currentQ] = i; renderQuestion(); setTimeout(() => goNext(), 500); }

function goNext() {
  if (answers[currentQ] === undefined) return;
  if (currentQ < 8) { currentQ++; renderQuestion(); }
  else { document.getElementById('quiz').classList.add('hidden'); document.getElementById('email-step').classList.remove('hidden'); }
}

function goBack() { if (currentQ > 0) { currentQ--; renderQuestion(); } }

function handleEmailSubmit() {
  const emailInput = document.getElementById('user-email');
  if (emailInput.checkValidity() && document.getElementById('first-name').value) {
    // TRIGGER SALESFORCE SUBMIT
    if (typeof SFDCFormHandler !== 'undefined') {
      SFDCFormHandler.submit('MC32QKQP6N55BIRPJ5OBMZ4JHTYM');
      console.log("Submitting to Salesforce...");
    }
    showResults();
  } else { emailInput.reportValidity(); }
}

function showResults() {
  document.getElementById('email-step').classList.add('hidden');
  const resultsEl = document.getElementById('results'); resultsEl.classList.remove('hidden');
  const pillarScores = { data: 0, strategy: 0, people: 0 };
  
  QUESTIONS.forEach((q, i) => {
    const sel = answers[i]; document.getElementById(`hid_q${i+1}`).value = q.options[sel].label;
    pillarScores[q.pillarKey] += q.options[sel].score;
  });
  
  const total = pillarScores.data + pillarScores.strategy + pillarScores.people;
  const tier = TIERS.find(t => total >= t.min && total <= t.max) || TIERS[4];
  
  document.getElementById('hid_score_data').value = pillarScores.data;
  document.getElementById('hid_score_strat').value = pillarScores.strategy;
  document.getElementById('hid_score_people').value = pillarScores.people;
  document.getElementById('hid_score_total').value = total;
  document.getElementById('hid_tier_name').value = tier.name;

  resultsEl.innerHTML = `<div class="result-hero"><h2>Level: ${tier.name}</h2><p>Total Score: ${total}/36</p></div><div class="recs-card"><h3>Focus Next:</h3><ul>${tier.recs.map(r => `<li>${r}</li>`).join('')}</ul></div>`;
  setTimeout(() => resultsEl.classList.add('visible'), 100);
}
</script>
<script async src="https://nebula.my.site.com/lp/assets/scripts/external-form-handler-host.min.js" onload="SFDCFormHandler.init('https://nebula.my.site.com/lp')"></script>
</body>
</html>
